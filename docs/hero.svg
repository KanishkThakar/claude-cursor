<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img" aria-label="An orange Claude cursor gliding inside an app window, leaving a glowing trail and a click ripple">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1714"/>
      <stop offset="1" stop-color="#2a1d17"/>
    </linearGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffa873" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffa873" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="960" height="440" rx="18" fill="url(#bg)"/>
  <!-- background window (another app, covers nothing of ours) -->
  <rect x="610" y="40" width="300" height="190" rx="12" fill="#2f2a26" opacity="0.7"/>
  <rect x="610" y="40" width="300" height="30" rx="12" fill="#3a3430" opacity="0.7"/>
  <!-- target window -->
  <g filter="url(#shadow)">
    <rect x="80" y="70" width="640" height="320" rx="14" fill="#fbfaf8"/>
    <path d="M80 84 a14 14 0 0 1 14 -14 h612 a14 14 0 0 1 14 14 v22 h-640z" fill="#ece8e3"/>
    <circle cx="104" cy="88" r="6" fill="#ff5f57"/><circle cx="124" cy="88" r="6" fill="#febc2e"/><circle cx="144" cy="88" r="6" fill="#28c840"/>
    <text x="400" y="93" text-anchor="middle" font-family="-apple-system, Segoe UI, sans-serif" font-size="13" fill="#6b6560">Document1</text>
    <rect x="120" y="140" width="300" height="12" rx="6" fill="#e7e2dc"/>
    <rect x="120" y="166" width="420" height="12" rx="6" fill="#e7e2dc"/>
    <rect x="120" y="192" width="360" height="12" rx="6" fill="#e7e2dc"/>
    <text x="120" y="250" font-family="-apple-system, Segoe UI, sans-serif" font-size="22" fill="#1f1d1b">Hello world<tspan fill="#d97757">|</tspan></text>
  </g>
  <!-- trail -->
  <path d="M190 330 C 300 320, 380 300, 470 262" stroke="#d97757" stroke-opacity="0.22" stroke-width="12" fill="none" stroke-linecap="round"/>
  <path d="M190 330 C 300 320, 380 300, 470 262" stroke="url(#trail)" stroke-width="3" fill="none" stroke-linecap="round"/>
  <circle cx="300" cy="318" r="3" fill="#ffd2b5"/><circle cx="352" cy="300" r="2" fill="#ffd2b5"/><circle cx="410" cy="292" r="2.5" fill="#ffd2b5"/><circle cx="440" cy="270" r="2" fill="#ffd2b5"/>
  <!-- ripple -->
  <circle cx="478" cy="256" r="22" fill="#ffa873" fill-opacity="0.25"/>
  <circle cx="478" cy="256" r="32" fill="none" stroke="#d97757" stroke-width="3.5" stroke-opacity="0.85"/>
  <circle cx="478" cy="256" r="46" fill="none" stroke="#ffa873" stroke-width="2" stroke-opacity="0.5"/>
  <!-- arrow -->
  <g transform="translate(478 256) rotate(-8)">
    <path d="M0 0 L0 28.8 L7.2 21.6 L13.2 33.6 L18 31.2 L12 19.2 L21.6 19.2 Z" fill="#d97757" filter="url(#glow)"/>
    <path d="M0 0 L0 28.8 L7.2 21.6 L13.2 33.6 L18 31.2 L12 19.2 L21.6 19.2 Z" fill="#d97757" stroke="#fff" stroke-width="2" stroke-linejoin="round"/>
    <rect x="26" y="34" width="122" height="22" rx="11" fill="#d97757" stroke="#fff" stroke-width="1.2"/>
    <text x="36" y="49.5" font-family="-apple-system, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#fff">Claude · typing</text>
  </g>
  <text x="80" y="425" font-family="-apple-system, Segoe UI, sans-serif" font-size="13" fill="#a59d95">Claude's own cursor lives inside the app it's working in. Yours stays free.</text>
</svg>
